<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Абушка Диплом | Вход в систему</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --deep-ink: #1a2c3e; --parchment: #fef7e6; --gold-accent: #c9a03d; --burgundy: #7a2e3b; --border-light: #e9dfc7; --shadow-soft: 0 20px 35px -12px rgba(0,0,0,0.2); }
        body { font-family: 'Inter', sans-serif; background: #e8ddc5; background-image: radial-gradient(circle at 10% 20%, rgba(201,160,61,0.08) 2%, transparent 2.5%); background-size: 45px 45px; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-container { background: var(--parchment); border-radius: 48px 32px; box-shadow: var(--shadow-soft); width: 100%; max-width: 500px; padding: 36px 32px 40px; border: 1px solid rgba(201,160,61,0.35); position: relative; }
        .auth-container::before { content: ""; position: absolute; top: -12px; left: 40px; right: 40px; height: 24px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 20"><path fill="%23c9a03d" fill-opacity="0.3" d="M10,10 Q30,2 50,10 T90,10 T110,5" stroke="%23c9a03d" stroke-width="1.2" fill="none"/><circle cx="10" cy="10" r="2" fill="%23c9a03d"/><circle cx="110" cy="10" r="2" fill="%23c9a03d"/></svg>') repeat-x; background-size: 60px 20px; }
        .auth-header { text-align: center; margin-bottom: 28px; }
        .auth-logo { width: 80px; height: 80px; background: var(--deep-ink); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; border: 2px solid var(--gold-accent); }
        .auth-logo svg { width: 48px; height: 48px; }
        .auth-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--deep-ink); }
        .auth-subtitle { font-size: 14px; color: #5f4c3b; border-top: 1px dashed var(--gold-accent); display: inline-block; padding-top: 8px; margin-top: 6px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #2c3e2f; margin-bottom: 6px; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px 18px; border: 1.5px solid var(--border-light); border-radius: 28px; font-size: 15px; background: white; }
        .form-control:focus { outline: none; border-color: var(--gold-accent); box-shadow: 0 0 0 4px rgba(201,160,61,0.2); }
        .radio-group { display: flex; gap: 24px; margin-top: 8px; }
        .radio-group label { display: flex; align-items: center; gap: 8px; font-weight: 500; text-transform: none; }
        .btn-submit { width: 100%; padding: 14px; background: var(--deep-ink); border: none; border-radius: 40px; font-size: 15px; font-weight: 600; color: white; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: var(--burgundy); transform: translateY(-2px); }
        .status-message { margin-top: 20px; padding: 12px; border-radius: 40px; font-size: 13px; text-align: center; display: none; }
        .status-message.error { background-color: #fff0f0; color: #b13e3e; }
        .status-message.success { background-color: #eef5e6; color: #2f6b3c; }
        .footer-links { margin-top: 24px; text-align: center; font-size: 13px; }
        .footer-links a { color: #8b6b3c; cursor: pointer; text-decoration: none; }
        .hidden { display: none !important; }
        .view-section { animation: fadeSlide 0.25s ease-out; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="auth-header">
        <div class="auth-logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2"><path d="M4 4H20V20H4V4Z" /><path d="M8 8H16M8 12H14M8 16H12" stroke-linecap="round"/><circle cx="17" cy="17" r="2"/></svg></div>
        <h1 class="auth-title">Абушка Диплом</h1>
        <p class="auth-subtitle">верификация документов об образовании</p>
    </div>

    <!-- Логин -->
    <div id="view-login" class="view-section">
        <form onsubmit="handleLogin(event)">
            <div class="form-group"><label>📧 Email</label><input type="email" id="login-email" class="form-control" required></div>
            <div class="form-group"><label>🔒 Пароль</label><input type="password" id="login-password" class="form-control" required></div>
            <button type="submit" class="btn-submit">Войти</button>
        </form>
        <div class="footer-links"><a onclick="switchView('view-register')">Регистрация</a> <a onclick="switchView('view-forgot')">Забыли пароль?</a></div>
    </div>

    <!-- Регистрация -->
    <div id="view-register" class="view-section hidden">
        <form onsubmit="handleRegister(event)">
            <div class="form-group"><label>Тип аккаунта</label><div class="radio-group"><label><input type="radio" name="roleType" value="STUDENT" checked> Студент</label><label><input type="radio" name="roleType" value="UNIVERSITY"> Учебное заведение</label></div></div>
            <div class="form-group"><label>Фамилия</label><input type="text" id="reg-secondName" class="form-control" required></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;"><div class="form-group"><label>Имя</label><input type="text" id="reg-name" class="form-control" required></div><div class="form-group"><label>Отчество</label><input type="text" id="reg-surName" class="form-control" required></div></div>
            <div class="form-group"><label>Email</label><input type="email" id="reg-email" class="form-control" required></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="reg-password" class="form-control" required></div>
            <div id="university-field-group" class="form-group hidden"><label>Название вуза</label><input type="text" id="reg-university" class="form-control"></div>
            <button type="submit" class="btn-submit">Создать аккаунт</button>
        </form>
        <div class="footer-links"><a onclick="switchView('view-login')">Уже есть аккаунт? Войти</a></div>
    </div>

    <!-- Подтверждение регистрации -->
    <div id="view-confirm" class="view-section hidden">
        <form onsubmit="handleConfirm(event)">
            <div class="form-group"><label>Код подтверждения</label><input type="text" id="confirm-code" class="form-control" placeholder="123456" style="text-align:center; letter-spacing:4px; font-size:20px;" required></div>
            <button type="submit" class="btn-submit">Подтвердить</button>
        </form>
        <div class="footer-links"><a onclick="resendCode()">Отправить код повторно</a> <a onclick="switchView('view-login')">Назад</a></div>
    </div>

    <!-- Забыли пароль -->
    <div id="view-forgot" class="view-section hidden">
        <form onsubmit="handleForgot(event)">
            <div class="form-group"><label>Email</label><input type="email" id="forgot-email" class="form-control" required></div>
            <button type="submit" class="btn-submit">Выслать код</button>
        </form>
        <div class="footer-links"><a onclick="switchView('view-login')">Назад</a></div>
    </div>

    <!-- Сброс пароля -->
    <div id="view-reset" class="view-section hidden">
        <form onsubmit="handleReset(event)">
            <div class="form-group"><label>Код</label><input type="text" id="reset-code" class="form-control" required></div>
            <div class="form-group"><label>Новый пароль</label><input type="password" id="reset-password" class="form-control" required></div>
            <button type="submit" class="btn-submit">Изменить пароль</button>
        </form>
        <div class="footer-links"><a onclick="switchView('view-login')">Войти</a></div>
    </div>

    <div id="global-status" class="status-message"></div>
</div>

<script>
    const BASE_URL = 'http://localhost:8765';
    let currentProcessEmail = '';

    function showStatus(text, isError) {
        const el = document.getElementById('global-status');
        el.style.display = 'block';
        el.innerText = text;
        el.className = 'status-message ' + (isError ? 'error' : 'success');
        setTimeout(() => el.style.display = 'none', 5000);
    }
    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');
        document.getElementById('global-status').style.display = 'none';
    }

    const roleRadios = document.querySelectorAll('input[name="roleType"]');
    const uniGroup = document.getElementById('university-field-group');
    function toggleUniversityField() {
        const isUni = document.querySelector('input[name="roleType"]:checked').value === 'UNIVERSITY';
        uniGroup.classList.toggle('hidden', !isUni);
        document.getElementById('reg-university').required = isUni;
    }
    roleRadios.forEach(r => r.addEventListener('change', toggleUniversityField));
    toggleUniversityField();

    // Логин
    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const btn = e.submitter; btn.disabled = true; btn.innerText = 'Вход...';
        try {
            const res = await fetch(`${BASE_URL}/auth/sign-in`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (res.ok) {
                const data = await res.json();
                const token = data.accessToken || data.token;
                localStorage.setItem('jwt_token', token);
                const payload = JSON.parse(atob(token.split('.')[1]));
                const userId = payload.userId || payload.id;
                localStorage.setItem('user_id', userId);
                showStatus('Успешный вход! Перенаправление...', false);
                setTimeout(() => window.location.href = 'dashboard.html', 800);
            } else {
                const err = await res.text();
                showStatus(err || 'Ошибка входа', true);
            }
        } catch(err) { showStatus('Ошибка сервера', true); }
        finally { btn.disabled = false; btn.innerText = 'Войти'; }
    }

    // Регистрация (ИСПРАВЛЕНО: добавлено поле role для студента)
    async function handleRegister(e) {
        e.preventDefault();
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const name = document.getElementById('reg-name').value;
        const secondName = document.getElementById('reg-secondName').value;
        const surName = document.getElementById('reg-surName').value;
        const role = document.querySelector('input[name="roleType"]:checked').value;
        const btn = e.submitter; btn.disabled = true; btn.innerText = 'Отправка...';
        try {
            if (role === 'UNIVERSITY') {
                const university = document.getElementById('reg-university').value.trim();
                if (!university) throw new Error('Укажите название вуза');
                const payload = { name, secondName, surName, password, email, role: 'ROLE_UNIVERSITY', university };
                const res = await fetch(`${BASE_URL}/api/users/registrationUniversity`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                if (res.ok) { currentProcessEmail = email; showStatus('Вуз зарегистрирован! Код подтверждения отправлен.', false); switchView('view-confirm'); }
                else { const txt = await res.text(); showStatus(txt || 'Ошибка регистрации вуза', true); }
            } else {
                // СТУДЕНТ: теперь отправляем role: "ROLE_STUDENT"
                const payload = { email, password, name, secondName, surName, role: 'ROLE_STUDENT' };
                const res = await fetch(`${BASE_URL}/api/users/registration`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                if (res.ok) { currentProcessEmail = email; showStatus('Регистрация успешна! Код подтверждения на почте.', false); switchView('view-confirm'); }
                else { const txt = await res.text(); showStatus(txt || 'Ошибка регистрации', true); }
            }
        } catch(err) { showStatus(err.message, true); }
        finally { btn.disabled = false; btn.innerText = 'Создать аккаунт'; }
    }

    // Подтверждение
    async function handleConfirm(e) {
        e.preventDefault();
        const code = document.getElementById('confirm-code').value;
        const btn = e.submitter; btn.disabled = true;
        try {
            const res = await fetch(`${BASE_URL}/api/users/confirm-registration?code=${encodeURIComponent(code)}`, { method: 'POST' });
            const text = await res.text();
            if (res.ok) { showStatus(text || 'Аккаунт подтверждён!', false); switchView('view-login'); }
            else showStatus(text || 'Неверный код', true);
        } catch(err) { showStatus('Ошибка сети', true); }
        finally { btn.disabled = false; }
    }
    async function resendCode() {
        if (!currentProcessEmail) return showStatus('Почта неизвестна', true);
        try {
            const res = await fetch(`${BASE_URL}/api/users/resend-confirm-registration?email=${encodeURIComponent(currentProcessEmail)}`, { method: 'POST' });
            const text = await res.text();
            showStatus(text || 'Код отправлен', !res.ok);
        } catch(e) { showStatus('Ошибка', true); }
    }

    // Забыли пароль
    async function handleForgot(e) {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value;
        const btn = e.submitter; btn.disabled = true;
        try {
            const res = await fetch(`${BASE_URL}/api/users/send-password-resetCode?email=${encodeURIComponent(email)}`, { method: 'POST' });
            const text = await res.text();
            if (res.ok) { currentProcessEmail = email; showStatus('Код отправлен', false); switchView('view-reset'); }
            else showStatus(text, true);
        } catch(e) { showStatus('Ошибка', true); }
        finally { btn.disabled = false; }
    }
    async function handleReset(e) {
        e.preventDefault();
        const code = document.getElementById('reset-code').value;
        const newPass = document.getElementById('reset-password').value;
        const btn = e.submitter; btn.disabled = true;
        try {
            const res = await fetch(`${BASE_URL}/api/users/reset-password-with-code?email=${encodeURIComponent(currentProcessEmail)}&code=${code}&newPassword=${newPass}`, { method: 'POST' });
            const text = await res.text();
            if (res.ok) { showStatus('Пароль изменён', false); switchView('view-login'); }
            else showStatus(text, true);
        } catch(e) { showStatus('Ошибка', true); }
        finally { btn.disabled = false; }
    }

    window.onload = () => {
        // Если есть токен, перенаправляем на дашборд (он теперь корректно обработает ошибки)
        if (localStorage.getItem('jwt_token')) {
            window.location.href = 'dashboard.html';
        }
    };
</script>
</body>
</html>
